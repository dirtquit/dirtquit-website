<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" fill="none" width="100%" height="100%">
  <defs>
    <!-- 4-pointed sparkle definition -->
    <path id="sparkle" d="M0 -18 C1 -6 6 -1 18 0 C6 1 1 6 0 18 C-1 6 -6 1 -18 0 C-6 -1 -1 -6 0 -18 Z" />
    <path id="sparkle-sm" d="M0 -12 C0.7 -4 4 -0.7 12 0 C4 0.7 0.7 4 0 12 C-0.7 4 -4 0.7 -12 0 C-4 -0.7 -0.7 -4 0 -12 Z" />
  </defs>

  <!-- Group for Logo Text & Illustration -->
  <g transform="translate(15, 10)">
    
    <!-- Word: "Dirt" (Dark Navy #0A2342) -->
    <g fill="#0A2342">
      <!-- Letter 'D' with custom hollow for sparkle star -->
      <path d="M 50 170 L 50 85 L 98 85 C 130 85 145 102 145 127.5 C 145 153 130 170 98 170 Z M 76 148 C 94 148 118 144 118 127.5 C 118 111 94 107 76 107 Z" fill-rule="evenodd" />
      
      <!-- Sparkle Star inside 'D' -->
      <path d="M 94 104 C 95 116 102 124 115 127.5 C 102 131 95 139 94 151 C 93 139 86 131 73 127.5 C 86 124 93 116 94 104 Z" fill="#FFFFFF" />

      <!-- Letter 'i' -->
      <circle cx="166" cy="94" r="14.5" />
      <rect x="153" y="116" width="26" height="54" rx="3" />

      <!-- Letter 'r' -->
      <path d="M 191 116 L 217 116 L 217 126 C 223 118 233 114 246 114 C 253 114 259 116 264 118 L 257 141 C 252 139 246 138 240 138 C 227 138 217 146 217 160 L 217 170 L 191 170 Z" />

      <!-- Letter 't' -->
      <path d="M 278 94 L 304 94 L 304 116 L 324 116 L 324 136 L 304 136 L 304 156 C 304 161 307 164 313 164 C 317 164 321 163 324 162 L 324 170 C 319 171 313 172 305 172 C 288 172 278 163 278 147 L 278 136 L 268 136 L 268 116 L 278 116 Z" />
    </g>

    <!-- Word: "Quit" (Vibrant Brand Blue #009FE3) -->
    <g fill="#009FE3">
      <!-- Letter 'Q' -->
      <path d="M 97 182 C 63 182 48 206 48 238 C 48 270 63 294 97 294 C 112 294 125 288 133 277 L 140 292 L 157 292 L 143 263 C 145 255 146 247 146 238 C 146 206 131 182 97 182 Z M 97 207 C 114 207 121 220 121 238 C 121 256 114 269 97 269 C 80 269 73 256 73 238 C 73 220 80 207 97 207 Z" fill-rule="evenodd" />

      <!-- Letter 'u' -->
      <path d="M 166 212 L 192 212 L 192 258 C 192 265 197 269 204 269 C 211 269 216 265 216 258 L 216 212 L 242 212 L 242 292 L 217 292 L 217 282 C 211 289 202 294 191 294 C 174 294 166 283 166 266 Z" />

      <!-- Letter 'i' -->
      <circle cx="265" cy="192" r="14.5" />
      <rect x="252" y="212" width="26" height="80" rx="3" />

      <!-- Letter 't' -->
      <path d="M 298 190 L 324 190 L 324 212 L 344 212 L 344 232 L 324 232 L 324 278 C 324 283 327 286 333 286 C 337 286 341 285 344 284 L 344 292 C 339 293 333 294 325 294 C 308 294 298 285 298 269 L 298 232 L 288 232 L 288 212 L 298 212 Z" />
    </g>

    <!-- Mop & Bucket Illustration -->
    <!-- Mop Handle angled at ~75 degrees -->
    <g transform="translate(325, 40)">
      <!-- Top Cap with Hole -->
      <rect x="74" y="10" width="20" height="42" rx="10" fill="#0A2342" transform="rotate(17 84 31)" />
      <ellipse cx="85" cy="24" rx="4" ry="7" fill="#FFFFFF" transform="rotate(17 85 24)" />
      
      <!-- Long Stick Handle -->
      <rect x="78" y="44" width="12" height="195" rx="6" fill="#0A2342" transform="rotate(17 84 141.5)" />

      <!-- Mop Connector Hood -->
      <path d="M 44 220 C 44 210 68 210 68 220 L 72 234 C 72 238 40 238 40 234 Z" fill="#009FE3" />
      <ellipse cx="56" cy="226" rx="13" ry="5" fill="#58C5F6" />

      <!-- Mop Fibers Swoosh (Flared curved skirt) -->
      <path d="M 40 232 C 34 246 22 268 25 284 C 26 290 32 296 46 296 C 70 296 90 296 112 296 C 118 296 122 291 115 285 C 98 271 78 262 70 232 Z" fill="#009FE3" />
      
      <!-- Mop Fiber Highlights/Strand separation curves -->
      <path d="M 37 252 C 35 268 40 286 52 292" stroke="#58C5F6" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 49 242 C 48 262 58 278 76 288" stroke="#0080B8" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M 60 240 C 62 258 75 272 98 284" stroke="#58C5F6" stroke-width="3" stroke-linecap="round" fill="none" />
    </g>

    <!-- Cleaning Bucket (Dark Navy #0A2342) -->
    <g transform="translate(400, 205)">
      <!-- Bucket Body with Rim -->
      <path d="M 12 18 L 84 18 C 88 18 90 22 89 27 L 76 96 C 75 101 70 105 65 105 L 31 105 C 26 105 21 101 20 96 L 7 27 C 6 22 8 18 12 18 Z" fill="#0A2342" />
      
      <!-- Top Rim Lip -->
      <rect x="5" y="16" width="86" height="10" rx="5" fill="#0A2342" />
      
      <!-- Bucket Handle (Curved Wire Loop Drooping Forward) -->
      <path d="M 9 24 C 18 62 74 72 87 36 C 89 42 89 54 86 64 C 74 92 24 82 8 36 Z" fill="#FFFFFF" opacity="0.95" />
      <circle cx="8" cy="24" r="3.5" fill="#A0AEC0" />
      <circle cx="88" cy="24" r="3.5" fill="#A0AEC0" />
    </g>

    <!-- Sparkles above the Bucket -->
    <use href="#sparkle" x="442" y="180" fill="#009FE3" />
    <use href="#sparkle-sm" x="466" y="202" fill="#009FE3" />

    <!-- Ground Baseline under Mop & Bucket -->
    <line x1="345" y1="337" x2="495" y2="337" stroke="#0A2342" stroke-width="4.5" stroke-linecap="round" />

    <!-- Tagline: CLEANER SPACES BRIGHTER LIVES -->
    <text x="50" y="360" font-family="'Manrope', 'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0A2342" letter-spacing="0.28em">
      CLEANER SPACES BRIGHTER LIVES
    </text>
  </g>
</svg>
